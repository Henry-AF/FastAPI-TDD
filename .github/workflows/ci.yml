name: CI

on:
  push:
    branches: [ "main", "green" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do repositório
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Instalar dependências
      run: |
        pip install -r requirements.txt

    - name: Black - verificação de formatação
      run: |
        black --check .

    - name: Flake8 - lint e estilo
      run: |
        flake8 .

    - name: Pytest - execução dos testes
      run: |
        pytest
